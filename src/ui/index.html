<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veil</title>
<link rel="stylesheet" href="ui.css">
<script src="icons.js" defer></script>
<script src="ui.js" defer></script>
</head>
<body>
<div id="chrome">
  <div id="tabstrip" role="tablist" aria-label="Tabs">
    <div id="tabs"></div>
    <button id="newtab" class="icon-btn" title="New tab" aria-label="New tab"></button>
    <div class="strip-fill"></div>
    <span id="private-badge" hidden>Private</span>
  </div>
  <div id="toolbar">
    <button id="back" class="icon-btn" title="Back" aria-label="Back"></button>
    <button id="forward" class="icon-btn" title="Forward" aria-label="Forward"></button>
    <button id="reload" class="icon-btn" title="Reload" aria-label="Reload"></button>
    <div id="omnibox">
      <span id="security" title=""></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search bar" placeholder="Search or enter address">
      <button id="star" class="icon-btn small" title="Bookmark this page" aria-label="Bookmark this page"></button>
    </div>
    <button id="shields" class="icon-btn shields-btn" title="Shields" aria-label="Shields"><span id="shield-count"></span></button>
    <button id="downloads" class="icon-btn" title="Downloads" aria-label="Downloads" hidden></button>
    <button id="menu" class="icon-btn" title="Menu" aria-label="Menu"></button>
  </div>
  <div id="findbar" hidden>
    <input id="find-input" type="text" spellcheck="false" aria-label="Find in page" placeholder="Find in page">
    <span id="find-count"></span>
    <button id="find-prev" class="icon-btn small" title="Previous match (Shift+Enter)" aria-label="Previous match"></button>
    <button id="find-next" class="icon-btn small" title="Next match (Enter)" aria-label="Next match"></button>
    <button id="find-close" class="icon-btn small" title="Close (Esc)" aria-label="Close find bar"></button>
  </div>
  <div id="infobars"></div>
</div>
<div id="backdrop" hidden></div>
<div id="suggestions" class="panel" role="listbox" hidden></div>
<div id="shields-panel" class="panel" hidden></div>
<div id="menu-panel" class="panel" hidden></div>
<div id="downloads-panel" class="panel" hidden></div>
<div id="toast" hidden></div>
</body>
</html>
