version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      electron:
        patterns: ["electron", "electron-builder", "@electron/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["electron", "electron-builder", "@electron/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
